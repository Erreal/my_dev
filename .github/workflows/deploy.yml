name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_export:
        description: "Skip database export (use cached JSON data)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy admin panel and scripts
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude 'config.php' \
            --exclude 'install.php' \
            ./admin/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/admin/

          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./scripts/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/scripts/

      - name: Deploy built frontend
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./frontend/out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/

      - name: Deploy root .htaccess
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            .htaccess \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.htaccess

      - name: Export database to JSON
        if: ${{ !inputs.skip_export }}
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             DB_HOST='${{ secrets.DB_HOST }}' \
             DB_PORT='${{ secrets.DB_PORT }}' \
             DB_NAME='${{ secrets.DB_NAME }}' \
             DB_USER='${{ secrets.DB_USER }}' \
             DB_PASS='${{ secrets.DB_PASS }}' \
             php scripts/export-json.php"

      - name: Rebuild frontend with fresh data
        if: ${{ !inputs.skip_export }}
        working-directory: ./frontend
        run: npm run build

      - name: Deploy rebuilt frontend
        if: ${{ !inputs.skip_export }}
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./frontend/out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment to erreality.ru completed successfully"